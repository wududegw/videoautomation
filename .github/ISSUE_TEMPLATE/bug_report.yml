name: Báo lỗi
about: Báo lỗi khi sử dụng videoautomation
title: "[Lỗi]: "
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        Cảm ơn bạn đã báo lỗi cho videoautomation. Vui lòng mô tả rõ cách tái hiện lỗi.
  - type: input
    id: version
    attributes:
      label: Phiên bản/commit
      description: Bạn đang dùng commit hoặc bản nào?
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      description: Liệt kê từng bước để gặp lỗi.
      placeholder: |
        1. Mở WebUI
        2. Chọn ...
        3. Bấm ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong muốn
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Kết quả thực tế/log lỗi
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Môi trường
      placeholder: |
        Windows 11
        Python 3.11
        streamlit 1.45.0
    validations:
      required: false
